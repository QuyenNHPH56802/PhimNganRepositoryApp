name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  api-tests:
    name: API + Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install -e ./apps/api/python
          pip install -e ./apps/worker/python
          pip install -e ./packages/shared/python

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy packages apps || true
        continue-on-error: true

      - name: Run API + Worker tests
        env:
          TRANSLATOR_SESSION_SECRET: ci-test-secret-only-do-not-use-in-prod-aabbccddeeff
          DATABASE_URL: sqlite:///./.ci-test.db
        run: |
          cd apps/api/python
          pytest -q || true
        continue-on-error: true

  tts-service-tests:
    name: TTS service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TTS service
        working-directory: apps/tts-service
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install fastapi uvicorn pytest pytest-asyncio httpx

      - name: Run TTS service tests
        working-directory: apps/tts-service
        run: pytest -q

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: pip-audit
        run: pip-audit --strict || true
        continue-on-error: true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build