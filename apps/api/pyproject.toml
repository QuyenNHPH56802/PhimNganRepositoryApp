[project]
name = "translator-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.31",
    "psycopg[binary]>=3.2.1",
    "alembic>=1.13.2",
    "boto3>=1.34.150",
    "temporalio>=1.7.0",
    "translator-shared",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]