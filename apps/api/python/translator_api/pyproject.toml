[project]
name = "translator-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "translator-shared",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "temporalio>=1.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["translator_api*"]
