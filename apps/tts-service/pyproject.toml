[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-tts-service"
version = "0.1.0"
description = "Standalone TTS microservice inspired by xTTS, shared by Translator platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "edge-tts>=6.1.10",
  "qwen-tts>=0.4.0 ; sys_platform != 'darwin' or platform_machine != 'arm64'",
  "httpx>=0.27",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["tts_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
