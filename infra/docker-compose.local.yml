name: translator-dev

services:
  postgres:
    environment:
      POSTGRES_DB: translator
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  temporal-postgresql:
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporalpass
    ports:
      - "5433:5432"

  temporal:
    image: temporalio/auto-setup:1.22.6
    depends_on:
      - temporal-postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporalpass
      POSTGRES_SEEDS: temporal-postgresql
      SKIP_DB_CREATE: "false"
    ports:
      - "7233:7233"

  api:
    environment:
      TRANSLATOR_DATABASE_URL: postgresql+psycopg://translator:translator@postgres:5432/translator
      TRANSLATOR_TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8000:8000"

  worker:
    environment:
      TRANSLATOR_DATABASE_URL: postgresql+psycopg://translator:translator@postgres:5432/translator
      TRANSLATOR_TEMPORAL_ADDRESS: temporal:7233

  web:
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

  temporal-ui:
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"

  minio-init:
    depends_on:
      - minio