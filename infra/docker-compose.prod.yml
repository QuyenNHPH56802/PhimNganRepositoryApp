# Production docker-compose for Translator.
#
# Layout overview:
#   * `caddy` terminates TLS, routes `/api/*` -> API, `/web/*` -> Web,
#     `/temporal/*` -> Temporal UI, `/grafana/*`, `/prometheus/*` -> monitoring.
#   * `api` and `worker` are pinned to `deploy.resources.limits` for OCI.
#   * `postgres` + `minio` are the storage backends. Replace MinIO with a
#     managed object store in OCI by setting `TRANSLATOR_STORAGE_BACKEND=s3`
#     and providing `s3_*` env vars; the api/worker compose still works.
#   * `redis` powers sliding-window rate limits.
#   * `temporal` (postgres-backed) runs alongside app processes.
#   * Monitoring stack: prometheus, grafana, loki, promtail, otel-collector,
#     alertmanager. The Caddyfile enforces basic auth on the monitoring
#     routes.
#
# Bring-up:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [translator]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: translator
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_pg.sql:/docker-entrypoint-initdb.d/init_pg.sql:ro
    networks: [translator]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d translator"]
      interval: 15s
      timeout: 5s
      retries: 6

  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres
      DB_PORT: 5432
      POSTGRES_USER: translator
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    volumes:
      - temporalpgdata:/var/lib/postgresql/data
    networks: [translator]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [translator]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [translator]

  api:
    build: ./api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      minio: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      TRANSLATOR_DATABASE_URL: postgres://translator:${POSTGRES_PASSWORD}@postgres:5432/translator
      TRANSLATOR_TEMPORAL_HOST: temporal:7233
      TRANSLATOR_STORAGE_BACKEND: s3
      TRANSLATOR_STORAGE_BUCKET: ${TRANSLATOR_STORAGE_BUCKET:?set TRANSLATOR_STORAGE_BUCKET}
      TRANSLATOR_STORAGE_ENDPOINT: http://minio:9000
      TRANSLATOR_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      TRANSLATOR_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TRANSLATOR_SESSION_SECRET: ${TRANSLATOR_SESSION_SECRET:?set TRANSLATOR_SESSION_SECRET}
      TRANSLATOR_REDIS_URL: redis://redis:6379/0
      TRANSLATOR_OTEL_EXPORTER_OTLP_ENDPOINT: ${TRANSLATOR_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [translator]
    deploy:
      resources:
        limits: { cpus: "2", memory: 4G }
        reservations: { cpus: "0.5", memory: 1G }

  worker:
    build: ./worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      minio: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      TRANSLATOR_DATABASE_URL: postgres://translator:${POSTGRES_PASSWORD}@postgres:5432/translator
      TRANSLATOR_TEMPORAL_HOST: temporal:7233
      TRANSLATOR_STORAGE_BACKEND: s3
      TRANSLATOR_STORAGE_BUCKET: ${TRANSLATOR_STORAGE_BUCKET:?set TRANSLATOR_STORAGE_BUCKET}
      TRANSLATOR_STORAGE_ENDPOINT: http://minio:9000
      TRANSLATOR_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      TRANSLATOR_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TRANSLATOR_REDIS_URL: redis://redis:6379/0
      TRANSLATOR_METRICS_PORT: 9091
    networks: [translator]
    deploy:
      resources:
        limits: { cpus: "4", memory: 8G }
        reservations: { cpus: "1", memory: 2G }

  web:
    build: ./web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_BASE: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}/api
    networks: [translator]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
        reservations: { cpus: "0.2", memory: 256M }

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks: [translator]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [translator]

  loki:
    image: grafana/loki:3.3.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    networks: [translator]

  promtail:
    image: grafana/promtail:3.3.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [translator]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otel-collector/config.yaml:ro
    networks: [translator]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [translator]

networks:
  translator:
    driver: bridge

volumes:
  pgdata:
  temporalpgdata:
  miniodata:
  caddy_data:
  caddy_config:
  redisdata:
  prometheusdata:
  grafanadata:
  lokidata: