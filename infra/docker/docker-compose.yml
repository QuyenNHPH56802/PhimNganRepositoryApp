version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/translator
      TEMPORAL_HOST: temporal
      STORAGE_BACKEND: local
    depends_on: [db, temporal]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/translator
      TEMPORAL_HOST: temporal
    depends_on: [db, temporal]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translator
    ports:
      - "5432:5432"

  temporal:
    image: temporalio/auto-setup:1.4
    environment:
      DB: postgresql://postgres:postgres@db:5432/temporal