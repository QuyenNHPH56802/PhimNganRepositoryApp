global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - "/etc/prometheus/alerts.yml"